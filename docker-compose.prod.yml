services:
  trigate-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trigate-app
    restart: always
    env_file:
      - .env
    volumes:
      - trigate_storage:/var/www/html/storage
      - trigate_bootstrap:/var/www/html/bootstrap/cache
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - trigate_net
      - app_agrisense

  trigate-nginx:
    image: nginx:alpine
    container_name: trigate-nginx
    restart: always
    volumes:
      - ./docker/nginx/trigate.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - trigate_storage:/var/www/html/storage:ro
    expose:
      - "80"
    depends_on:
      trigate-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trigate_net
      - hospital_proxy

volumes:
  trigate_storage:
  trigate_bootstrap:

networks:
  trigate_net:
    driver: bridge
  app_agrisense:
    external: true
  hospital_proxy:
    external: true
    name: hospital-appointment-demo_default
