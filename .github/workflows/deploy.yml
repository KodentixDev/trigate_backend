name: Deploy to production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull latest code and rebuild container
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /root/trigate_backend
            git fetch origin
            git reset --hard origin/master
            docker compose -f docker-compose.prod.yml build trigate-app
            docker compose -f docker-compose.prod.yml up -d trigate-app trigate-nginx
            docker network connect hospital-appointment-demo_default trigate-nginx 2>/dev/null || true
            docker exec trigate-app php artisan migrate --force
            docker exec trigate-app php artisan config:clear
            docker exec trigate-app php artisan cache:clear
            docker exec trigate-app php artisan route:clear
            docker restart trigate-nginx
          '

      - name: Verify deployment
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://trigate.kodentix.com/api/auth/me")
          echo "GET /api/auth/me -> HTTP $code"
          if [ "$code" != "401" ]; then
            echo "Deployment verification failed: expected 401 Unauthenticated"
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            echo "--- docker ps ---"
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Networks}}"
            echo "--- trigate-app logs ---"
            docker logs --tail 80 trigate-app
            echo "--- trigate-nginx logs ---"
            docker logs --tail 40 trigate-nginx
          '
